name: CI

on: [push, pull_request]

jobs:
  c-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build all C modules
        run: make -C c
      - name: Run KAT tests
        run: |
          for m in aes des md2 md5 rc4 sha1 sha256; do
            echo "=== Testing $m ==="
            cd c/$m && make && ./demo-test || exit 1
            cd ../..
          done

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pytest-cov || true
      - name: Run tests
        run: |
          cd python
          python -m pytest tests/ -v

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Build with Maven
        run: cd java && mvn test --no-transfer-progress
